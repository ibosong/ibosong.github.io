<!doctype html>
<html lang="{{ site.lang | default: 'zh-CN' }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <link rel="stylesheet" href="{{ '/css/main.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/syntax.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/lib/font-awesome/css/font-awesome.min.css' | relative_url }}">
  <title>{{ page.title | default: site.title | escape }} | {{ site.title | escape }}</title>
</head>
<body>
  <div class="container sidebar-position-left page-post-detail">
    <div class="headband"></div>
    <header id="header" class="header">
      <div class="header-inner">
        <div class="site-brand-wrapper">
          <div class="site-meta">
            <div class="custom-logo-site-title">
              <a href="{{ '/' | relative_url }}" class="brand" rel="start">
                <span class="logo-line-before"><i></i></span>
                <span class="site-title">{{ site.title }}</span>
                <span class="logo-line-after"><i></i></span>
              </a>
            </div>
            <p class="site-subtitle">{{ site.description }}</p>
          </div>
        </div>
        <nav class="site-nav">
          <ul class="menu">
            <li class="menu-item"><a href="{{ '/' | relative_url }}">首页</a></li>
            <li class="menu-item"><a href="{{ '/blog/' | relative_url }}">博客</a></li>
            <li class="menu-item"><a href="{{ '/tags/' | relative_url }}">标签</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <main id="main" class="main">
      <div class="main-inner">
        <div class="content-wrap">
          <div id="content" class="content">
            {{ content }}
          </div>
        </div>
      </div>
    </main>

    <footer id="footer" class="footer">
      <div class="footer-inner">
        <div class="copyright">&copy; {{ 'now' | date: '%Y' }} {{ site.title }}</div>
      </div>
    </footer>
  </div>
</body>
</html>
