---
layout: default
title: 博客
---
<div id="posts" class="posts-expand blog-index-wrap">
  <div class="post-block page blog-index-intro">
    <header class="post-header">
      <h1 class="post-title">博客</h1>
    </header>
    <div class="post-body">
      <p>文章和技术记录。</p>
    </div>
  </div>

  {% for post in site.posts %}
  <article class="post post-type-normal blog-index-card" itemscope itemtype="http://schema.org/Article">
    <div class="post-block">
      <header class="post-header">
        <h2 class="post-title" itemprop="name headline">
          <a class="post-title-link" href="{{ post.url | relative_url }}" itemprop="url">{{ post.title }}</a>
        </h2>
        <div class="post-meta">
          <time class="post-time" itemprop="datePublished" datetime="{{ post.date | date_to_xmlschema }}">
            {{ post.date | date: "%Y-%m-%d" }}
          </time>
        </div>
      </header>
      <div class="post-body" itemprop="articleBody">
        {{ post.excerpt | strip_html | truncate: 180 }}
        <div class="post-button text-center">
          <a class="btn" href="{{ post.url | relative_url }}">阅读全文 &raquo;</a>
        </div>
      </div>
    </div>
  </article>
  {% endfor %}
</div>
